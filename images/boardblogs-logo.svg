<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2048" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">BoardBlogs — Blogger ve Blogspot Destek Forumu</title>
  <desc id="desc">Turuncu ve lacivert metalik B amblemi, BoardBlogs yazısı ve destek forumu sloganı.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".16" stop-color="#ffad18"/>
      <stop offset=".48" stop-color="#ff6500"/>
      <stop offset=".76" stop-color="#d83b00"/>
      <stop offset="1" stop-color="#7e1d00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8beaff"/>
      <stop offset=".22" stop-color="#087bdc"/>
      <stop offset=".58" stop-color="#063b82"/>
      <stop offset="1" stop-color="#07152f"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#dce6f2"/>
      <stop offset=".58" stop-color="#8795a8"/>
      <stop offset=".82" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#66758a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123d68"/>
      <stop offset=".5" stop-color="#071b35"/>
      <stop offset="1" stop-color="#020a18"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a00"/>
      <stop offset=".48" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#008fe8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="14" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.005 0 0 0 0 0.025 0 0 0 0 0.07 0 0 0 .75 0" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Emblem: layered blue speech panel and orange B -->
  <g filter="url(#shadow)" transform="translate(0,-8)">
    <path d="M565 55 C710 8 927 20 1050 105 C1160 181 1192 321 1105 413
             C1038 484 901 500 760 470 L552 430 C472 414 421 349 443 267
             C461 197 496 102 565 55Z"
          fill="#020b1d" stroke="#07172e" stroke-width="18"/>
    <path d="M586 62 C724 28 912 44 1025 120 C1125 187 1146 300 1082 376
             C1025 444 912 459 779 433 L577 394 C509 381 466 326 482 263
             C499 190 527 96 586 62Z"
          fill="url(#blue)" stroke="#20baff" stroke-width="7"/>
    <path d="M620 93 C750 62 906 77 1000 140" fill="none" stroke="#a5edff" stroke-width="8" opacity=".8" stroke-linecap="round"/>
    <path d="M1020 125 C1093 186 1104 266 1064 326" fill="none" stroke="#061a3b" stroke-width="18" opacity=".8" stroke-linecap="round"/>

    <!-- Speech bubbles -->
    <path d="M895 294 C895 241 941 207 1001 207 C1060 207 1104 241 1104 294
             C1104 345 1060 379 1001 379 C984 379 969 376 954 370 L918 397 L926 357
             C906 340 895 319 895 294Z"
          fill="#087fe0" stroke="#071b38" stroke-width="12"/>
    <path d="M786 348 C786 307 822 279 870 279 C918 279 954 307 954 348
             C954 389 918 417 870 417 C856 417 844 414 831 409 L803 430 L810 397
             C794 384 786 367 786 348Z"
          fill="url(#orange)" stroke="#07152d" stroke-width="11"/>
    <g fill="#fff" filter="url(#glow)">
      <circle cx="963" cy="294" r="10"/><circle cx="1000" cy="294" r="10"/><circle cx="1037" cy="294" r="10"/>
      <circle cx="844" cy="348" r="10"/><circle cx="871" cy="348" r="10"/><circle cx="898" cy="348" r="10"/>
    </g>

    <!-- Main B -->
    <path d="M452 112 Q452 73 493 73 H706 Q840 73 840 178 Q840 239 790 267
             Q878 293 878 377 Q878 493 727 493 H493 Q452 493 452 452Z"
          fill="#07172f" stroke="#020916" stroke-width="22" transform="translate(10,14)"/>
    <path d="M430 100 Q430 62 470 62 H682 Q816 62 816 167 Q816 228 766 256
             Q854 282 854 366 Q854 482 703 482 H470 Q430 482 430 442Z"
          fill="url(#orange)" stroke="#ffbd43" stroke-width="8"/>
    <path d="M474 106 H676 Q770 106 770 170 Q770 232 676 232 H474Z"
          fill="#071b34" stroke="#ffb23c" stroke-width="7"/>
    <path d="M474 296 H690 Q790 296 790 370 Q790 438 690 438 H474Z"
          fill="#071b34" stroke="#ffb23c" stroke-width="7"/>
    <path d="M489 119 H670 Q741 119 741 169 Q741 218 670 218 H489"
          fill="none" stroke="#ffdf8a" stroke-width="5" opacity=".75"/>
    <path d="M489 309 H683 Q761 309 761 369 Q761 426 683 426 H489"
          fill="none" stroke="#ffdf8a" stroke-width="5" opacity=".65"/>

    <!-- Orbital sweep -->
    <path d="M348 432 C514 467 744 406 952 241 C1058 157 1125 87 1162 53
             C1109 180 1009 312 863 397 C674 507 471 544 363 497
             C325 480 316 454 348 432Z"
          fill="#03142c" stroke="#071a34" stroke-width="15"/>
    <path d="M342 414 C517 454 744 386 950 222 C1045 146 1110 83 1148 48
             C1092 174 990 301 848 384 C665 491 463 525 356 482
             C322 468 314 438 342 414Z"
          fill="none" stroke="url(#swoosh)" stroke-width="19" stroke-linecap="round"/>
    <path d="M350 411 C524 448 744 379 946 219" fill="none" stroke="#fff0b0" stroke-width="4" opacity=".8"/>
  </g>

  <!-- Wordmark -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" filter="url(#shadow)">
    <text x="800" y="650" font-size="142" letter-spacing="-7" fill="#07162c" stroke="#020914" stroke-width="18" paint-order="stroke">BoardBlogs</text>
    <text x="800" y="638" font-size="142" letter-spacing="-7" fill="url(#silver)" stroke="#152b45" stroke-width="5" paint-order="stroke">Board</text>
    <text x="1120" y="638" font-size="142" letter-spacing="-7" fill="url(#orange)" stroke="#762500" stroke-width="5" paint-order="stroke">Blogs</text>
  </g>

  <!-- Slogan plaque -->
  <g filter="url(#shadow)">
    <rect x="180" y="690" width="1240" height="82" rx="38" fill="url(#bar)" stroke="url(#swoosh)" stroke-width="7"/>
    <rect x="191" y="700" width="1218" height="62" rx="29" fill="none" stroke="#7fcfff" stroke-width="2" opacity=".55"/>
    <!-- Community glyph -->
    <g fill="#fff" transform="translate(235 708)">
      <circle cx="25" cy="14" r="10"/><circle cx="57" cy="14" r="10"/><circle cx="89" cy="14" r="10"/>
      <path d="M7 48 Q7 27 25 27 Q43 27 43 48Z M39 48 Q39 27 57 27 Q75 27 75 48Z M71 48 Q71 27 89 27 Q107 27 107 48Z"/>
    </g>
    <path d="M370 705 V757" stroke="#fff" stroke-width="3" opacity=".8"/>
    <text x="900" y="747" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#fff">
      Blogger ve Blogspot <tspan fill="#ff8a16">Destek Forumu</tspan>
    </text>
  </g>
</svg>